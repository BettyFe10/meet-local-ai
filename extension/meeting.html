<!doctype html>
<html lang="it">
<head><meta charset="utf-8"><title>Meet Local AI — Riunione</title><link rel="stylesheet" href="styles.css"></head>
<body>
<div class="page">
  <div class="topbar">
    <div class="titlebox">
      <h1 id="title">Riunione</h1>
      <button class="link" id="btnRename" title="Rinomina">✎ Rinomina</button>
      <span id="renameBox" hidden>
        <input type="text" id="renameInput" maxlength="200">
        <button class="btn inline" id="renameSave">Salva</button>
        <button class="btn inline" id="renameCancel">Annulla</button>
      </span>
    </div>
    <nav><a href="dashboard.html">← Riunioni</a><a href="settings.html">Impostazioni</a></nav>
  </div>
  <div id="banner"></div>
  <div class="meta"><span id="date">—</span><span id="duration">—</span><span id="status">—</span></div>
  <div class="actions noprint">
    <button class="btn inline" id="btnTranscript" disabled>Trascrizione</button>
    <button class="btn inline" id="btnAudio" disabled>Audio</button>
    <button class="btn inline" id="btnFolder" disabled>Apri cartella</button>
    <button class="btn inline" id="btnSummary" hidden>Genera sintesi</button>
    <button class="btn inline" id="btnReprocess" hidden>Rielabora</button>
  </div>
  <div class="actions noprint">
    <button class="btn inline" id="btnExportMd">Esporta Markdown</button>
    <button class="btn inline" id="btnExportTxt">Esporta TXT</button>
    <button class="btn inline" id="btnPrint">Stampa / PDF</button>
    <span class="spacer"></span>
    <button class="btn inline danger" id="btnDelete">Elimina</button>
  </div>
  <div id="confirmDelete" class="banner off noprint" hidden>
    Spostare questa riunione nel Cestino? Audio, trascrizione e verbale verranno rimossi dall'elenco (recuperabili dal Cestino del Mac).
    <div class="actions"><button class="btn inline danger" id="btnDeleteYes">Sì, elimina</button>
    <button class="btn inline" id="btnDeleteNo">Annulla</button></div>
  </div>
  <div id="info" class="small muted noprint"></div>
  <div id="audioBox" class="card" hidden><h3>Audio</h3><audio id="player" controls preload="metadata"></audio></div>
  <div id="transcriptBox" class="card" hidden><h3>Trascrizione</h3><pre id="transcript" class="transcript"></pre></div>
  <div id="warnings" class="small muted"></div>
  <div id="sections"></div>
  <div id="summaryNote" class="small muted"></div>
</div>
<script type="module" src="meeting.js"></script>
</body>
</html>
